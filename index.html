  render(pShell(`<div style="font-size:4em">${medal}</div><h1>Platz ${m.rank} von ${m.total}</h1><p style="font-size:1.3em"><b>${m.score}</b> Punkte</p><p>${m.rank === 1 ? 'Gewonnen! Super gemacht!' : m.rank <= 3 ? 'Klasse, du bist auf dem Treppchen!' : 'Gut gemacht! Beim nächsten Mal geht noch mehr.'}</p><button class="btn acc" data-act="nav" data-to="">Fertig</button>`));
}

/* ---- Antwort-Bausteine (Live und Hausaufgabe) ---- */
const AUI = { cb: null, m: null, sel: new Set(), ord: [] };
function decimals(step) { return (String(step).split('.')[1] || '').length; }
function auiHtml(m) {
  AUI.m = m; AUI.sel = new Set(); AUI.ord = m.items ? m.items.map((_, i) => i) : [];
  const send = '<button class="btn acc lg" data-act="auiSend" style="width:100%;max-width:700px">Abschicken</button>';
  switch (m.type) {
    case 'quiz': case 'tf': case 'poll':
      return `${m.multi ? '<div class="small">Wähle alle richtigen Antworten aus.</div>' : ''}<div class="ptiles">${m.opts.map((o, i) => { const c = colorIdx(m.type, i); return `<button class="ptile a${c}" data-act="auiPick" data-i="${i}">${shape(c)}${o ? `<span>${esc(o)}</span>` : ''}</button>`; }).join('')}</div>${m.multi ? send : ''}`;
    case 'type': return `<div class="pinput"><input id="auiText" maxlength="40" placeholder="Deine Antwort" autocomplete="off" autocapitalize="off" spellcheck="false" data-enter="auiSend">${send}</div>`;
    case 'cloud': return `<div class="pinput"><input id="auiText" maxlength="25" placeholder="Ein Wort" autocomplete="off" data-enter="auiSend">${send}</div>`;
    case 'open': return `<div class="pinput"><textarea id="auiText" maxlength="250" rows="4" placeholder="Deine Antwort"></textarea>${send}</div>`;
    case 'order': return `<div class="small">Sortiere mit den Pfeilen: oben steht das Erste.</div><div class="porder" id="auiOrder"></div>${send}`;
    case 'slider': {
      const s = m.slider, mid = s.min + Math.round((s.max - s.min) / 2 / s.step) * s.step;
      return `<div class="pslider"><div class="val"><span id="auiVal">${mid.toFixed(decimals(s.step))}</span> <span style="font-size:.4em">${esc(s.unit || '')}</span></div>
        <input type="range" id="auiRange" min="${s.min}" max="${s.max}" step="${s.step}" value="${mid}" data-f="auiRange">
        <div class="row between small"><span>${s.min}</span><span>${s.max}</span></div></div>${send}`;
    }
  }
  return '';
}
function auiAfter() { if (AUI.m && AUI.m.type === 'order') auiRenderOrder(); const t = $('#auiText'); if (t) setTimeout(() => t.focus(), 50); }
function auiRenderOrder() {
  const box = $('#auiOrder'); if (!box) return;
  box.innerHTML = AUI.ord.map((d, pos) => `<div class="it a${d}">${shape(d)}<span>${esc(AUI.m.items[d])}</span><button data-act="auiMove" data-p="${pos}" data-d="-1" ${pos === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="nach oben">▲</button><button data-act="auiMove" data-p="${pos}" data-d="1" ${pos === AUI.ord.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="nach unten">▼</button></div>`).join('');
}
IH.auiRange = el => { const v = $('#auiVal'); if (v) v.textContent = Number(el.value).toFixed(decimals(AUI.m.slider.step)); };
Object.assign(A, {
  auiPick(el) {
    const i = +el.dataset.i;
    if (!AUI.m.multi) return AUI.cb && AUI.cb([i]);
    AUI.sel.has(i) ? AUI.sel.delete(i) : AUI.sel.add(i); el.classList.toggle('sel');
  },
  auiMove(el) { const p = +el.dataset.p, q = p + +el.dataset.d; [AUI.ord[p], AUI.ord[q]] = [AUI.ord[q], AUI.ord[p]]; auiRenderOrder(); },
  auiSend() {
    const m = AUI.m; let v;
    if (['quiz', 'tf', 'poll'].includes(m.type)) { if (!AUI.sel.size) return toast('Wähle mindestens eine Antwort.'); v = [...AUI.sel]; }
    else if (m.type === 'order') v = [...AUI.ord];
    else if (m.type === 'slider') v = Number($('#auiRange').value);
    else { v = $('#auiText').value.trim(); if (!v) return toast('Bitte erst etwas eingeben.'); }
    const cb = AUI.cb; AUI.cb = null; cb && cb(v);
  },
});

/* ---- Hausaufgaben-Modus ---- */
let HW = null;
async function viewHomework(code) {
  let d;
  try { d = await unpack(code); if (!d.qs) throw 0; }
  catch (e) { render(pShell('<h2>😕 Der Link ist unvollständig</h2><p>Bitte den ganzen Link kopieren oder die Lehrkraft fragen.</p>')); return; }
  const saved = Store.get('hwp-' + d.id, null);
  HW = { d, i: 0, score: 0, streak: 0, correct: 0, answers: [], name: '' };
  if (saved && saved.done) return hwShowCode(saved);
  render(pShell(`<div style="font-size:3em">🏠</div><h1>${esc(d.title)}</h1><p>${d.qs.length} Fragen${d.timer ? ' · mit Zeitlimit' : ' · ohne Zeitdruck'}</p>${d.note ? `<div class="pq">${esc(d.note)}</div>` : ''}
    <div class="pinput"><input id="hwName" maxlength="30" placeholder="Vor- und Nachname" value="${esc(saved?.name || '')}" autocomplete="off" data-enter="hwStart">
    <button class="btn acc lg" data-act="hwStart">${saved ? 'Weitermachen' : 'Starten'}</button></div>`));
}
A.hwStart = () => {
  const name = cleanName($('#hwName').value.slice(0, 30));
  if (!name || name.length < 2) return toast('Bitte gib deinen Namen ein.', 'bad');
  const saved = Store.get('hwp-' + HW.d.id, null);
  if (saved && saved.name === name) Object.assign(HW, { i: saved.i, score: saved.score, streak: saved.streak, correct: saved.correct, answers: saved.answers });
  HW.name = name;
  hwShowQ();
};
function hwSave(extra) { Store.set('hwp-' + HW.d.id, Object.assign({ name: HW.name, i: HW.i, score: HW.score, streak: HW.streak, correct: HW.correct, answers: HW.answers }, extra || {})); }
function hwShowQ() {
  clearInterval(HW.int);
  const q = HW.d.qs[HW.i];
  HW.perm = q.type === 'quiz' && HW.d.shuf ? shuffle(q.options.map((_, i) => i)) : q.type === 'order' ? (() => { let p, t = 0; do { p = shuffle(q.items.map((_, i) => i)); t++; } while (t < 30 && p.every((x, i) => x === i)); return p; })() : q.options ? q.options.map((_, i) => i) : null;
  const m = { type: q.type, multi: !!q.multi, opts: q.options ? HW.perm.map(i => q.options[i].text) : null, items: q.type === 'order' ? HW.perm.map(i => q.items[i]) : null, slider: q.slider || null };
  AUI.cb = hwAnswer;
  HW.t0 = performance.now();
  let bar = '';
  if (HW.d.timer) {
    HW.end = Date.now() + q.time * 1000;
    bar = `<div class="pbarline"><i id="pTime" style="width:100%"></i></div>`;
    HW.int = setInterval(() => { const l = HW.end - Date.now(), el = $('#pTime'); if (el) el.style.width = clamp(l / (q.time * 1000) * 100, 0, 100) + '%'; if (l <= 0) { clearInterval(HW.int); AUI.cb = null; hwAnswer(null); } }, 250);
  }
  render(`<div class="pstage"><div class="pbar"><span>${esc(HW.name)} · Frage ${HW.i + 1}/${HW.d.qs.length}</span><span class="sc">${HW.score}</span></div>${bar}
    <div class="pmain"><div class="pq" style="font-size:1.15em">${esc(q.text)}</div>${q.image ? `<img src="${q.image}" alt="" style="max-height:30vh;max-width:100%;border-radius:12px">` : ''}
    <button class="btn ghost sm" data-act="hwSpeak">🔈 Vorlesen</button>${auiHtml(m)}</div></div>`);
  auiAfter();
}
A.hwSpeak = () => { const q = HW.d.qs[HW.i]; speakQuestion(q, q.options ? HW.perm.map(i => q.options[i].text) : null); };
function hwAnswer(vd) {
  clearInterval(HW.int);
  const q = HW.d.qs[HW.i], ms = performance.now() - HW.t0;
  let v = null;
  if (vd != null) v = ['quiz', 'tf', 'poll', 'order'].includes(q.type) ? vd.map(d => HW.perm[d]) : vd;
  const correct = grade(q, v), scored = isScored(q);
  let pts = 0;
  if (scored) { if (correct) { HW.streak++; pts = (HW.d.timer ? calcPoints(q, true, ms) : 1000 * q.points) + streakBonus(HW.streak); } else HW.streak = 0; }
  HW.score += pts; if (correct === true) HW.correct++;
  HW.answers[HW.i] = [answerDisplay(q, v).slice(0, 60), correct, pts];
  HW.i++; hwSave();
  const graded = TYPES[q.type].scored;
  let cls = 'neutral', big = 'Antwort gespeichert 👍';
  if (graded) { cls = correct ? 'okbg' : 'badbg'; big = v == null ? 'Zeit ist um ⏰' : correct ? 'Richtig! ✅' : 'Leider falsch ❌'; }
  const last = HW.i >= HW.d.qs.length;
  render(`<div class="pstage"><div class="pbar"><span>${esc(HW.name)}</span><span class="sc">${HW.score}</span></div><div class="result ${cls}">
    <div class="big">${big}</div>${pts ? `<div class="pts">+ ${pts} Punkte</div>` : ''}${scored && correct && HW.streak >= 2 ? `<div>🔥 Serie: ${HW.streak}</div>` : ''}
    ${graded && !correct ? `<div>Richtig wäre: <b>${esc(correctDisplay(q))}</b></div>` : ''}
    <button class="btn acc lg" data-act="${last ? 'hwFinish' : 'hwNext'}" style="margin-top:1em">${last ? 'Ergebnis anzeigen' : 'Weiter ▶'}</button></div></div>`);
}
A.hwNext = () => hwShowQ();
A.hwFinish = async () => {
  const o = { h: HW.d.id, t: HW.d.title, n: HW.name, s: HW.score, c: HW.correct, a: HW.answers, ts: Date.now() };
  o.k = hashStr(JSON.stringify(o) + '|qz');
  const code = 'QZ1-' + await pack(o);
  const nScored = HW.d.qs.filter(isScored).length;
  const res = { done: true, name: HW.name, score: HW.score, correct: HW.correct, total: nScored, code, title: HW.d.title };
  hwSave(res); hwShowCode(res);
};
function hwShowCode(r) {
  render(pShell(`<div style="font-size:3em">🎉</div><h1>Geschafft, ${esc(r.name)}!</h1><p style="font-size:1.2em"><b>${r.correct} von ${r.total}</b> richtig · ${r.score} Punkte</p>
    <div class="pq" style="text-align:left"><b>Dein Ergebnis-Code</b><br><span class="small">Kopiere den Code und schicke ihn deiner Lehrkraft.</span>
    <textarea id="hwCode" readonly rows="4" style="margin-top:.5em;font-size:.75em" onclick="this.select()">${esc(r.code)}</textarea>
    <button class="btn acc" data-act="hwCopy" style="margin-top:.5em;width:100%">📋 Code kopieren</button></div>
    <button class="btn ghost sm" data-act="hwReset">Andere Person an diesem Gerät: neu starten</button>`));
}
A.hwReset = async () => { if (!await confirmBox('Ergebnis auf diesem Gerät löschen und neu starten? Den Code vorher kopieren!', 'Neu starten')) return; try { localStorage.removeItem('quizzer.hwp-' + HW.d.id); } catch (e) { } location.reload(); };
A.hwCopy = () => copyText($('#hwCode').value);

/* ============ Start & Navigation ============ */
function nav(h) { if (location.hash.slice(1) === h || (h === '' && !location.hash)) route(); else location.hash = h; }
A.nav = el => nav(el.dataset.to);
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (G && h !== 'host-' + G.quiz.id) stopHost();
  if (P && !h.startsWith('join') && h !== '') { try { P.net && P.net.close(); } catch (e) { } P = null; }
  if (ED) saveED();
  ED = null;
  if (h.startsWith('hw=')) return viewHomework(h.slice(3));
  if (h.startsWith('join')) return viewJoin(h.split('=')[1] || '');
  if (h === 'lehrkraft') return viewLibrary();
  if (h.startsWith('edit-')) return viewEditor(h.slice(5));
  if (h.startsWith('host-')) return viewHostSetup(h.slice(5));
  if (h === 'import') return viewImport();
  if (h === 'reports') return viewReports();
  if (h.startsWith('report-')) return viewReport(h.slice(7));
  if (h === 'hweval') return viewHwEval();
  if (h === 'hilfe') return viewHelp();
  if (h === 'verbindung') return viewConnection();
  if (P && P.phase !== 'closed' && P.phase !== 'end') { try { P.net && P.net.close(); } catch (e) { } P = null; }
  viewHome();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  if (IH[f]) IH[f](el); else if (IH.edit) IH.edit(el);
});
document.addEventListener('change', e => { const el = e.target, f = el.dataset && el.dataset.f; if (f && CH[f]) CH[f](el); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.enter && A[t.dataset.enter]) { e.preventDefault(); A[t.dataset.enter](t, e); return; }
  if (G && [' ', 'Enter', 'ArrowRight'].includes(e.key) && !['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(document.activeElement && document.activeElement.tagName) && !$('.modal-bg')) {
    const n = $('[data-next]'); if (n && !n.disabled) { e.preventDefault(); n.click(); }
  }
});
window.addEventListener('hashchange', route);
route();

</script>
